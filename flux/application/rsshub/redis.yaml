---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: rsshub-redis
spec:
  podSecurityContext:
    fsGroup: 999
    runAsUser: 999
  kubernetesConfig:
    image: redis:alpine3.22
    resources:
      requests:
        memory: 64Mi
  storage:
    volumeClaimTemplate:
      metadata:
        labels:
          k8up.io/backup-target: rsshub
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 128Mi
